# Общие настройки backend и worker (worker — тот же код, другой процесс)
x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_DB: janamen
  POSTGRES_USER: janamen
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janamen_dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://localhost:5173
  DJANGO_MEDIA_ROOT: /media
  DJANGO_PRIVATE_MEDIA_ROOT: /private
  # Интеграции: заглушки в этом же compose. Для боевых систем меняются только URL и ключи.
  HRIS_PROVIDER: ${HRIS_PROVIDER:-zup_http}
  ZUP_BASE_URL: ${ZUP_BASE_URL:-http://mock-zup:8001}
  ZUP_USER: ${ZUP_USER:-janamen}
  ZUP_PASSWORD: ${ZUP_PASSWORD:-zup_dev}
  DOCFLOW_PROVIDER: ${DOCFLOW_PROVIDER:-documentolog_http}
  DOCUMENTOLOG_BASE_URL: ${DOCUMENTOLOG_BASE_URL:-http://mock-documentolog:8002}
  DOCUMENTOLOG_TOKEN: ${DOCUMENTOLOG_TOKEN:-docflow_dev}
  DOCUMENTOLOG_WEBHOOK_SECRET: ${DOCUMENTOLOG_WEBHOOK_SECRET:-dev-webhook-secret}
  BACKEND_PUBLIC_URL: http://backend:8000
  # AI Jana: локальная модель — сервис ollama ниже. Ollama, установленная на компьютер: http://host.docker.internal:11434
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
  AI_MIN_SCORE: ${AI_MIN_SCORE:-0.45}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: janamen
      POSTGRES_USER: janamen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janamen_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janamen -d janamen"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      # Код монтируется, чтобы сгенерированные миграции появились в репозитории.
      - ./backend:/app
      # Файлы уроков Academy (фото, видео, PDF)
      - media:/media
      # Резюме кандидатов — закрытый том, nginx к нему доступа не имеет
      - private:/private
    ports:
      - "8000:8000"
    extra_hosts:
      # доступ к Ollama, запущенной на самом компьютере (на Linux тоже)
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      mock-zup:
        condition: service_started
      mock-documentolog:
        condition: service_started

  # Повторяет отправки утверждённых заявок в 1С и Documentolog (outbox)
  worker:
    build: ./backend
    entrypoint: ["python", "manage.py", "run_worker"]
    environment: *backend-env
    volumes:
      - ./backend:/app
      - media:/media
      - private:/private
    depends_on:
      - backend

  # Заглушка HTTP-сервиса 1С:ЗУП: сотрудники, оргструктура, остатки отпуска, документы «Отпуск»
  mock-zup:
    build: ./mocks/zup
    environment:
      ZUP_USER: ${ZUP_USER:-janamen}
      ZUP_PASSWORD: ${ZUP_PASSWORD:-zup_dev}
    ports:
      - "8001:8001"

  # Заглушка Documentolog: принимает приказ и через 10 с «подписывает» его (обратный вызов в backend)
  mock-documentolog:
    build: ./mocks/documentolog
    environment:
      DOCUMENTOLOG_TOKEN: ${DOCUMENTOLOG_TOKEN:-docflow_dev}
      DOCUMENTOLOG_WEBHOOK_SECRET: ${DOCUMENTOLOG_WEBHOOK_SECRET:-dev-webhook-secret}
      SIGN_DELAY: ${DOCUMENTOLOG_SIGN_DELAY:-10}
    ports:
      - "8002:8002"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/media:ro
    depends_on:
      - backend

  # Локальная модель для AI Jana. Модель хранится в томе ollama: скачивается один раз (~4,9 ГБ)
  # сервисом ollama-pull ниже при первом `docker compose up`, дальше берётся с диска.
  # Без видеокарты NVIDIA модель работает на процессоре: ответ ~30–90 с, нужно ~6 ГБ памяти в Docker.
  ollama:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_KEEP_ALIVE: 24h  # модель остаётся в памяти — без 10–20 с загрузки перед каждым ответом
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # Один раз скачивает модель в том ollama и завершается (если модель уже есть — сразу).
  # Ход загрузки: docker compose logs -f ollama-pull
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.1:8b}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  pgdata:
  media:
  private:
  ollama:
