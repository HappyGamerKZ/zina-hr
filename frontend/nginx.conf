server {
    listen 80;
    root /usr/share/nginx/html;

    # Загрузка видео и файлов уроков через Django Admin
    client_max_body_size 200m;

    # API, Django Admin и его статика — в backend (один origin: cookie и CSRF без CORS)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы уроков Academy: общий том с backend. Скрипты внутри файлов (например, SVG) не выполняются.
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "script-src 'none'";
    }

    # SPA: все остальные пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
